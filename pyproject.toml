[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Capstone-graphs"
version = "0.1.0"
description = "AI Agentathon- Graph Workflow Agents with LangChain"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.10",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain>=1.3,<2.0",
    "langchain-core>=1.2.17",
    "langchain-deepseek>=1.0.1,<2.0",
    "langchain-openai>=1.1.10",
    "python-dotenv>=1.2.2",
    "pydantic>=2.12,<3.0",
    "typing_extensions>=4.15.0",
    "grandalf>=0.8",
    "gradio>=6.9.0",
    "streamlit>=1.66.1",
    "pypdf>=6.21.4",
    "faiss-cpu>=1.15.1",
    "langchain-community>=0.4.2",
    "tiktoken>=0.13.0",
    "reportlab>=5.1.0",
    "python-pptx>=1.0.2",
    "fastembed>=0.9.1",
]

[tool.uv]
package = false
